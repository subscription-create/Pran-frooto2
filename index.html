  .ballimg{position:absolute;opacity:.95;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));animation:floatUp linear infinite;}
  @keyframes floatUp{
    0%{transform:translateY(270px) rotate(0deg);}
    100%{transform:translateY(-30px) rotate(360deg);}
  }
  .logo{position:absolute;left:6px;top:5px;width:76px;z-index:5;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));animation:pop .8s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes pop{from{transform:scale(0) rotate(-12deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .wclogo{
    position:absolute;right:4px;top:4px;width:40px;z-index:5;
    background:radial-gradient(circle at 50% 35%, #3a2410, #160c04 75%);
    border-radius:9px;padding:4px 5px;border:1.5px solid rgba(255,210,0,.55);
    box-shadow:0 3px 9px rgba(0,0,0,.35);
    animation:pop .8s .9s cubic-bezier(.2,1.6,.4,1) both, neon 2.6s 2s ease-in-out infinite;
  }
  @keyframes neon{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.25));}50%{filter:drop-shadow(0 0 9px rgba(255,255,255,.6));}}

  .headline{
    position:absolute;left:7px;top:60px;width:120px;color:#fff;
    font-weight:900;font-style:italic;line-height:1.04;
    text-transform:uppercase;letter-spacing:.2px;z-index:5;
    animation:slideIn .7s .25s cubic-bezier(.2,1.4,.4,1) both;
  }
  .headline .l1{font-size:12px;color:var(--frooto-yellow);text-shadow:1px 1px 0 var(--frooto-red);}
  .headline .l2{font-size:16.5px;text-shadow:1px 1.5px 0 var(--frooto-red), 2px 3px 6px rgba(0,0,0,.3);position:relative;overflow:hidden;display:inline-block;padding-right:2px;}
  .headline .l2::after{
    content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent);
    animation:shine 3.2s 1.2s ease-in-out infinite;
  }
  @keyframes shine{0%{left:-80%;}45%{left:130%;}100%{left:130%;}}
  @keyframes slideIn{from{transform:translateX(-30px);opacity:0;}to{transform:none;opacity:1;}}

  .kits{position:absolute;left:7px;top:114px;width:128px;z-index:6;animation:slideIn .7s .55s both;}
  .kitLabel{color:#fff;font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;
    text-shadow:0 1px 2px rgba(0,0,0,.6);margin-bottom:3px;}
  .kitRow{display:flex;gap:4px;}
  .kit{width:21px;height:21px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);cursor:pointer;
    font-family:inherit;font-size:6px;font-weight:900;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.8);
    box-shadow:0 2px 4px rgba(0,0,0,.4);transition:transform .15s, box-shadow .15s;padding:0;}
  .kit:hover{transform:scale(1.2);}
  .kit:focus-visible{outline:2px solid #fff;outline-offset:1px;}
  .kit.active{border-color:var(--frooto-yellow);box-shadow:0 0 0 2px rgba(255,210,0,.55),0 2px 4px rgba(0,0,0,.4);transform:scale(1.12);}

  .bottle{
    position:absolute;left:2px;bottom:-3px;width:46px;z-index:4;
    filter:drop-shadow(3px 5px 8px rgba(0,0,0,.4));
    animation:bottleIn 1s .5s cubic-bezier(.2,1.5,.4,1) both, bob 3.4s 1.6s ease-in-out infinite;
    transform-origin:bottom center;
  }
  @keyframes bottleIn{from{transform:translateY(130px) rotate(8deg);}to{transform:none;}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-4px) rotate(-2deg);}}

  .controls{position:absolute;left:52px;bottom:6px;width:70px;display:flex;flex-direction:column;gap:3px;z-index:6;
    animation:slideIn .7s .65s both;}
  .btn{
    border:none;cursor:pointer;font-weight:900;font-size:6.5px;text-transform:uppercase;
    padding:3.5px 2px;border-radius:9px;letter-spacing:.15px;font-family:inherit;color:#fff;
    transition:transform .15s;
  }
  .btn:hover{transform:translateY(-1px) scale(1.04);}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:1px;}
  .btn-selfie{background:var(--frooto-red);box-shadow:0 2px 0 #9c1009,0 4px 7px rgba(0,0,0,.3);animation:pulse 1.8s 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 2px 0 #9c1009,0 0 0 0 rgba(255,210,0,.7);}50%{box-shadow:0 2px 0 #9c1009,0 0 0 6px rgba(255,210,0,0);}}
  .btn-upload{background:var(--frooto-green);box-shadow:0 2px 0 #115c25,0 4px 7px rgba(0,0,0,.3);}
  .zoomRow{display:none;align-items:center;gap:3px;background:rgba(255,255,255,.92);border-radius:8px;padding:1px 4px;}
  .zoomRow span{font-weight:900;color:var(--frooto-red);font-size:8px;}
  .zoomRow input{flex:1;accent-color:var(--frooto-red);height:10px;}

  .stage{position:absolute;right:-2px;top:26px;width:178px;height:227px;z-index:3;
    animation:jerseyIn .9s .35s cubic-bezier(.2,1.4,.4,1) both;}
  @keyframes jerseyIn{from{transform:translateX(80px) scale(.8);opacity:0;}to{transform:none;opacity:1;}}
  .sway{animation:sway 5s 1.6s ease-in-out infinite;transform-origin:50% 18%;width:100%;height:100%;}
  @keyframes sway{0%,100%{transform:rotate(0);}25%{transform:rotate(1.3deg);}75%{transform:rotate(-1.3deg);}}
  #faceHit{cursor:grab;}
  #faceHit:active{cursor:grabbing;}

  .wcball{
    position:absolute;left:148px;bottom:0px;width:42px;z-index:2;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
    animation:ballIn .9s .8s cubic-bezier(.2,1.5,.4,1) both, ballRoll 4s 1.8s ease-in-out infinite;
  }
  @keyframes ballIn{from{transform:translateY(90px) rotate(-180deg);}to{transform:none;}}
  @keyframes ballRoll{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-7px) rotate(12deg);}}

  .footer{
    position:absolute;right:6px;bottom:3px;color:#fff;font-size:7px;font-weight:bold;
    text-shadow:0 1px 2px rgba(0,0,0,.5);opacity:.9;z-index:5;
  }

  /* ---- selfie camera overlay ---- */
  .camOverlay{
    position:absolute;inset:0;z-index:30;display:none;flex-direction:column;
    background:rgba(10,5,0,.92);border-radius:10px;overflow:hidden;
  }
  .camOverlay.open{display:flex;}
  .camOverlay video{
    flex:1;width:100%;object-fit:cover;transform:scaleX(-1);background:#000;
  }
  .camBar{display:flex;gap:6px;padding:7px;justify-content:center;background:rgba(20,10,0,.85);}
  .camBtn{
    border:none;cursor:pointer;font-weight:900;font-size:10px;font-family:inherit;color:#fff;
    padding:7px 14px;border-radius:16px;text-transform:uppercase;letter-spacing:.3px;
  }
  .camSnap{background:var(--frooto-red);box-shadow:0 2.5px 0 #9c1009;}
  .camCancel{background:rgba(255,255,255,.18);}
  .camMsg{position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font-size:9px;font-weight:bold;text-shadow:0 1px 2px #000;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;}
  }
</style>
</head>

    nt.setAttribute('fill', k.num); nt.setAttribute('stroke', k.numS);
    document.getElementById('argStripes').style.display = k.arg ? '' : 'none';
    document.getElementById('gerBand').style.display = k.ger ? '' : 'none';
  }
  document.querySelectorAll('.kit').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.kit').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyKit(btn.dataset.kit);
    });
  });

  // ----- shared photo loader -----
  function loadPhoto(dataURL){
    const img = new Image();
    img.onload = () => {
      state.natW = img.naturalWidth; state.natH = img.naturalHeight;
      state.scale = 1.15; state.ox = 0; state.oy = 0; state.loaded = true;
      face.setAttribute('href', dataURL);
      face.setAttributeNS('http://www.w3.org/1999/xlink','href', dataURL);
      ph.style.display = 'none';
      zoomRow.style.display = 'flex';
      hint.style.display = 'block';
      zoom.value = 115;
      btnUpload.textContent = '🔁 Change';
      render();
      setTimeout(()=>hint.style.display='none', 4000);
    };
    img.src = dataURL;
  }

  // ----- upload path -----
  btnUpload.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => loadPhoto(ev.target.result);
    reader.readAsDataURL(f);
  });

  // ----- selfie camera path -----
  btnSelfie.addEventListener('click', async () => {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      fileInput.setAttribute('capture','user'); fileInput.click(); fileInput.removeAttribute('capture');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:720}}, audio:false});
      camVideo.srcObject = stream;
      camOverlay.classList.add('open');
    }catch(err){
      // permission denied or no camera -> fall back to device camera/file picker
      fileInput.setAttribute('capture','user'); fileInput.click(); fileInput.removeAttribute('capture');
    }
  });
  function stopCam(){
    if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    camVideo.srcObject = null;
    camOverlay.classList.remove('open');
  }
  camCancel.addEventListener('click', stopCam);
  camSnap.addEventListener('click', () => {
    if(!camVideo.videoWidth){ return; }
    const cv = document.createElement('canvas');
    cv.width = camVideo.videoWidth; cv.height = camVideo.videoHeight;
    const ctx = cv.getContext('2d');
    // mirror to match the preview
    ctx.translate(cv.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(camVideo, 0, 0);
    const dataURL = cv.toDataURL('image/jpeg', .92);
    stopCam();
    loadPhoto(dataURL);
  });

  // ----- position photo in frame -----
  function render(){
    if(!state.loaded) return;
    const D = 132;
    const base = Math.max(D/state.natW, D/state.natH) * state.scale;
    const w = state.natW*base, h = state.natH*base;
    face.setAttribute('width', w);
    face.setAttribute('height', h);
    face.setAttribute('x', C.cx - w/2 + state.ox);
    face.setAttribute('y', C.cy - h/2 + state.oy);
    face.removeAttribute('preserveAspectRatio');
  }
  zoom.addEventListener('input', () => { state.scale = zoom.value/100; render(); });

  let drag = null;
  function pt(e){
    const r = svg.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x:(t.clientX-r.left)*(368/r.width), y:(t.clientY-r.top)*(470/r.height)};
  }
  function down(e){ if(!state.loaded) return; drag = {p:pt(e), ox:state.ox, oy:state.oy}; e.preventDefault(); }
  function move(e){
    if(!drag) return;
    const p = pt(e);
    state.ox = drag.ox + (p.x - drag.p.x);
    state.oy = drag.oy + (p.y - drag.p.y);
    render(); e.preventDefault();
  }
  function up(){ drag = null; }
  hit.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  hit.addEventListener('touchstart', down, {passive:false});
  window.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', up);
  hit.addEventListener('wheel', e => {
    if(!state.loaded) return;
    e.preventDefault();
    state.scale = Math.min(3, Math.max(.6, state.scale - e.deltaY*0.0015));
    zoom.value = Math.round(state.scale*100);
    render();
  }, {passive:false});
})();
</script>
</body>
</html>
